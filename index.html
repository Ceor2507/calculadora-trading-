<!DOCTYPE html>

<head>

    <!-- Configuración personalizada de colores para Tailwind (Tema Trading) -->

        tailwind.config = {
            theme: {
                extend: {

                        trade: {

</head>

   <script>

            <!-- Calculadora 1: Interés Compuesto -->

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Inputs -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-trade-gray mb-1">Capital Inicial ($)</label>
                                <input type="number" id="ci-principal" value="1000" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue focus:ring-1 focus:ring-trade-blue transition-all">
                            </div>
                            <div>

                                <input type="number" id="ci-addition" value="100" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue focus:ring-1 focus:ring-trade-blue transition-all">

                                <input type="number" id="ci-rate" value="10" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue focus:ring-1 focus:ring-trade-blue transition-all">

                                <input type="number" id="ci-years" value="10" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue focus:ring-1 focus:ring-trade-blue transition-all">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <div>

                                <input type="number" id="ps-balance" value="5000" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue transition-all">

                                <label class="block text-sm font-medium text-trade-gray mb-1">Valor por Pip/Punto Estándar ($)</label>
                                <input type="number" id="ps-pip-value" value="10" placeholder="Ej: 10 para EURUSD" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue transition-all">
                            </div>
                            <button onclick="calculatePositionSize()" class="w-full bg-gradient-to-r from-trade-blue to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg shadow-trade-blue/20">
                                Calcular Lotes

                        </div>
                        
                        <div class="bg-trade-input rounded-xl p-6 flex flex-col justify-center border border-gray-700">

                            <div class="text-4xl font-bold text-trade-blue mb-2" id="ps-result-lots">0.00 <span class="text-xl">Lotes</span></div>
                            <p class="text-sm text-trade-gray mb-4">Lotes estándar</p>
                            
                            <div class="space-y-3 pt-4 border-t border-gray-700">
                                <div class="flex justify-between text-sm">
                                    <span class="text-trade-gray">Dinero en Riesgo:</span>
                                    <span id="ps-result-risk-money" class="font-medium text-trade-red">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calculadora 3: Riesgo / Beneficio -->
            <div id="tab-risk" class="calc-section hidden">
                <div class="bg-trade-card p-6 rounded-2xl shadow-xl border border-gray-800">
                    <h2 class="text-2xl font-bold mb-2">Ratio Riesgo/Beneficio (R:R)</h2>
                    <p class="text-trade-gray text-sm mb-6">Evalúa si vale la pena tomar un trade antes de entrar.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-trade-gray mb-1">Tipo de Operación</label>
                                <select id="rr-type" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue transition-all text-white">
                                    <option value="long">Compra (Long)</option>
                                    <option value="short">Venta (Short)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-trade-gray mb-1">Precio de Entrada</label>
                                <input type="number" id="rr-entry" step="0.0001" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-blue transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-trade-gray mb-1">Precio de Stop Loss (SL)</label>
                                <input type="number" id="rr-sl" step="0.0001" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-red transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-trade-gray mb-1">Precio de Take Profit (TP)</label>
                                <input type="number" id="rr-tp" step="0.0001" class="w-full bg-trade-input border border-gray-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-trade-green transition-all">
                            </div>
                            <button onclick="calculateRiskReward()" class="w-full bg-gradient-to-r from-trade-blue to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-all transform hover:scale-[1.02] shadow-lg shadow-trade-blue/20">
                                Analizar Trade
                            </button>
                        </div>
                        
                        <div class="bg-trade-input rounded-xl p-6 flex flex-col justify-center border border-gray-700">
                            <h3 class="text-lg font-medium text-trade-gray mb-4">Ratio R:R Resultante</h3>
                            <div class="text-4xl font-bold mb-4" id="rr-result-ratio">1 : 0.00</div>
                            
                            <div class="space-y-3 pt-4 border-t border-gray-700">
                                <div class="flex justify-between text-sm">
                                    <span class="text-trade-gray">Distancia a Riesgo (SL):</span>
                                    <span id="rr-risk-dist" class="font-medium text-trade-red">0.00</span>

                                <div class="flex justify-between text-sm">

            <!-- AdSlot 2: Middle Content (Banner) -->

                <div class="ad-placeholder ad-leaderboard rounded-lg">
                    <span>Espacio Anuncio Medio (728x90) - Native/Banner</span>

        </div>

        <!-- Barra lateral (Sidebar) para anuncios cuadrados -->
        <aside class="w-full lg:w-80 flex-shrink-0 space-y-6 hidden lg:block">

                <!-- AdSlot 3: Sidebar (MREC) -->
                <div class="ad-placeholder ad-mrec rounded-lg">
                    <span class="text-center px-4">Anuncio Cuadrado (300x250)<br>Ideal Afiliados/Brokers</span>
                </div>
            </div>
            
            <div class="bg-trade-card p-6 rounded-2xl shadow-xl border border-gray-800">
                <h3 class="text-sm font-bold text-trade-gray mb-2 uppercase tracking-wider">Aviso Legal</h3>

                    El comercio de divisas, CFDs y criptomonedas conlleva un alto nivel de riesgo. Los resultados mostrados en estas calculadoras son netamente informativos y matemáticos, no constituyen asesoramiento financiero.

    <!-- AdSlot 4: Bottom / Mobile (MREC visible on mobile) -->
    <div class="w-full py-6 px-4 lg:hidden">
         <div class="ad-placeholder ad-mrec rounded-lg">
            <span class="text-center px-4">Anuncio Cuadrado Móvil (300x250)</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-trade-card border-t border-gray-800 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-trade-gray text-sm">&copy; 2024 ProTrade Tools. Todos los derechos reservados.</p>

    <!-- Lógica JavaScript (Vanilla) -->
    <script>
        // Función para mostrar errores en la interfaz (reemplazo de alert)
        function showError(message) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        // Función para cambiar entre pestañas
        function switchTab(tabId) {
            try {
                // Ocultar todas las secciones
                document.querySelectorAll('.calc-section').forEach(el => el.classList.add('hidden'));
                // Quitar clase activa de todos los botones
                document.querySelectorAll('.tab-btn').forEach(el => {
                    el.classList.remove('active', 'text-trade-blue');
                    el.classList.add('text-trade-gray');
                });
                
                // Mostrar la sección seleccionada
                document.getElementById(tabId).classList.remove('hidden');
                document.getElementById(tabId).classList.add('block');
                
                // Activar el botón correspondiente
                const btn = document.getElementById(`btn-${tabId}`);
                btn.classList.add('active', 'text-trade-blue');
                btn.classList.remove('text-trade-gray');
            } catch (error) {
                console.error("Error cambiando pestaña:", error);
            }
        }

        // Formateador de moneda USD
        const currencyFormatter = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
        });

        // 1. Lógica Interés Compuesto
        function calculateCompoundInterest() {
            try {
                const principal = parseFloat(document.getElementById('ci-principal').value);
                const monthlyAddition = parseFloat(document.getElementById('ci-addition').value);
                const annualRate = parseFloat(document.getElementById('ci-rate').value) / 100;
                const years = parseFloat(document.getElementById('ci-years').value);

                if (isNaN(principal) || isNaN(monthlyAddition) || isNaN(annualRate) || isNaN(years) || years <= 0) {
                    showError("Por favor ingresa valores numéricos válidos mayores a cero.");
                    return;
                }

                const months = years * 12;
                const monthlyRate = annualRate / 12;
                let futureValue = principal;
                let totalInvested = principal;

                // Cálculo mes a mes para precisión con aportes
                for (let i = 0; i < months; i++) {
                    futureValue = (futureValue + monthlyAddition) * (1 + monthlyRate);
                    totalInvested += monthlyAddition;
                }

                const totalInterest = futureValue - totalInvested;

                // Actualizar UI
                document.getElementById('ci-result-total').textContent = currencyFormatter.format(futureValue);
                document.getElementById('ci-result-invested').textContent = currencyFormatter.format(totalInvested);
                document.getElementById('ci-result-interest').textContent = currencyFormatter.format(totalInterest);
            } catch (error) {
                showError("Ocurrió un error en el cálculo.");
            }
        }

        // 2. Lógica Tamaño de Posición
        function calculatePositionSize() {
            try {
                const balance = parseFloat(document.getElementById('ps-balance').value);
                const riskPct = parseFloat(document.getElementById('ps-risk').value);
                const slPips = parseFloat(document.getElementById('ps-sl').value);
                const pipValue = parseFloat(document.getElementById('ps-pip-value').value);

                if (isNaN(balance) || isNaN(riskPct) || isNaN(slPips) || isNaN(pipValue) || slPips <= 0 || pipValue <= 0) {
                    showError("Revisa que todos los campos sean números positivos y SL/Pip Value > 0.");
                    return;
                }

                // Riesgo en Dinero = Balance * (Porcentaje / 100)
                const riskMoney = balance * (riskPct / 100);
                
                // Valor por pip requerido = Riesgo / Pips de SL
                const requiredPipValue = riskMoney / slPips;
                
                // Lotes = Valor requerido / Valor de 1 lote estándar
                const lots = requiredPipValue / pipValue;

                // Actualizar UI
                document.getElementById('ps-result-lots').innerHTML = `${lots.toFixed(2)} <span class="text-xl">Lotes</span>`;
                document.getElementById('ps-result-risk-money').textContent = currencyFormatter.format(riskMoney);
            } catch (error) {
                showError("Ocurrió un error calculando el lotaje.");
            }
        }

        // 3. Lógica Riesgo / Beneficio
        function calculateRiskReward() {
            try {
                const type = document.getElementById('rr-type').value;
                const entry = parseFloat(document.getElementById('rr-entry').value);
                const sl = parseFloat(document.getElementById('rr-sl').value);
                const tp = parseFloat(document.getElementById('rr-tp').value);

                if (isNaN(entry) || isNaN(sl) || isNaN(tp)) {
                    showError("Ingresa precios de entrada, SL y TP válidos.");
                    return;
                }

                let risk, reward;

                if (type === 'long') {
                    if (sl >= entry || tp <= entry) {
                        showError("Para Compras (Long): SL debe ser menor a la Entrada, y TP mayor a la Entrada.");
                        return;
                    }
                    risk = entry - sl;
                    reward = tp - entry;
                } else { // short
                    if (sl <= entry || tp >= entry) {
                        showError("Para Ventas (Short): SL debe ser mayor a la Entrada, y TP menor a la Entrada.");
                        return;
                    }
                    risk = sl - entry;
                    reward = entry - tp;
                }

                const ratio = reward / risk;

                // UI Updates
                const ratioEl = document.getElementById('rr-result-ratio');
                ratioEl.textContent = `1 : ${ratio.toFixed(2)}`;
                
                // Colorear el ratio dependiendo de si es bueno (> 1.5) o malo
                if (ratio >= 2) {
                    ratioEl.className = "text-4xl font-bold mb-4 text-trade-green";
                } else if (ratio >= 1) {
                    ratioEl.className = "text-4xl font-bold mb-4 text-white";
                } else {
                    ratioEl.className = "text-4xl font-bold mb-4 text-trade-red";
                }

                document.getElementById('rr-risk-dist').textContent = risk.toFixed(4);
                document.getElementById('rr-reward-dist').textContent = reward.toFixed(4);

                // Veredicto
                const verdictEl = document.getElementById('rr-verdict');
                if (ratio >= 2) {
                    verdictEl.textContent = "Trade Óptimo (R:R > 1:2)";
                    verdictEl.className = "mt-4 p-3 bg-trade-green/10 text-trade-green border border-trade-green/30 rounded text-sm text-center font-medium";
                } else if (ratio >= 1) {
                    verdictEl.textContent = "Trade Aceptable (R:R > 1:1)";
                    verdictEl.className = "mt-4 p-3 bg-gray-800 text-white border border-gray-600 rounded text-sm text-center font-medium";
                } else {
                    verdictEl.textContent = "Trade Peligroso (Riesgas más de lo que ganas)";
                    verdictEl.className = "mt-4 p-3 bg-trade-red/10 text-trade-red border border-trade-red/30 rounded text-sm text-center font-medium";
                }

            } catch (error) {
                showError("Ocurrió un error evaluando el riesgo/beneficio.");
            }
        }

        // Ejecutar los cálculos iniciales al cargar la página para mostrar datos de ejemplo
        window.onload = function() {
            calculateCompoundInterest();
            calculatePositionSize();
            // Para el R:R, llenamos unos datos default para que no esté vacío al inicio
            document.getElementById('rr-entry').value = "1.1050";
            document.getElementById('rr-sl').value = "1.1000";
            document.getElementById('rr-tp').value = "1.1200";
            calculateRiskReward();
        };
    </script>
</body>
</html>
