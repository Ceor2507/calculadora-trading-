<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrade Tools | Calculadoras Financieras y de Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0B0E14',
                            800: '#151A22',
                            700: '#222A35',
                        },
                        accent: '#00E1FF',
                        danger: '#FF3366',
                        muted: '#8C9AAB'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0B0E14;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-dark-800 border-b border-dark-700 py-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="bg-accent text-dark-900 font-bold px-3 py-1 rounded text-lg">PT</span>
                <span class="text-xl font-bold tracking-wider">ProTrade <span class="text-accent">Tools</span></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        <div class="bg-dark-800 border border-dark-700 rounded-xl p-6 shadow-xl">
            <h1 class="text-2xl font-bold mb-2 text-center">Calculadora de Lote y Riesgo</h1>
            <p class="text-muted mb-6 text-center">Gestiona el riesgo de tus operaciones de forma profesional.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-muted mb-1">Capital de la Cuenta ($)</label>
                    <input type="number" id="capital" value="1000" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-white focus:border-accent outline-none">
                </div>
                <div>
                    <label class="block text-sm text-muted mb-1">Riesgo por Operación (%)</label>
                    <input type="number" id="risk" value="1" class="w-full bg-dark-900 border border-dark-700 rounded-lg p-3 text-white focus:border-accent outline-none">
                </div>
                <div class="p-4 bg-dark-900 rounded-lg border border-dark-700 text-center mt-6">
                    <p class="text-sm text-muted">Cantidad a Arriesgar:</p>
                    <p id="result" class="text-3xl font-bold text-accent mt-1">$10.00</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-800 border-t border-dark-700 py-4 text-center text-sm text-muted">
        <p>&copy; 2026 ProTrade Tools. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
